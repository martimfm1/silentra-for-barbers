name: one-time marketplace tracking formatter

on:
  push:
    branches:
      - feat/marketplace-order-tracking-production

permissions:
  contents: write

jobs:
  format-and-remove-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/marketplace-order-tracking-production
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format tracking implementation
        id: format
        continue-on-error: true
        run: |
          pnpm exec prettier --write \
            app/api/marketplace/orders/route.ts \
            app/api/marketplace/orders/track/route.ts \
            app/api/marketplace/orders/\[orderId\]/route.ts \
            app/marketplace/track/page.tsx \
            app/marketplace/track/tracking-client.tsx \
            app/layout.tsx \
            lib/marketplace/tracking.ts \
            supabase/migrations/20261013180000_marketplace_order_tracking_capabilities.sql \
            scripts/qa/api-audit.mjs \
            scripts/qa/product-contracts.mjs \
            docs/PRODUCTION-RELEASE-CHECKLIST.md \
            docs/marketplace-qa-checklist.md \
            docs/marketplace-product-experience.md

      - name: Remove one-time formatter and push formatted files
        env:
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-marketplace-tracking-once.yml
          git add \
            app/api/marketplace/orders/route.ts \
            app/api/marketplace/orders/track/route.ts \
            app/api/marketplace/orders/\[orderId\]/route.ts \
            app/marketplace/track/page.tsx \
            app/marketplace/track/tracking-client.tsx \
            app/layout.tsx \
            lib/marketplace/tracking.ts \
            supabase/migrations/20261013180000_marketplace_order_tracking_capabilities.sql \
            scripts/qa/api-audit.mjs \
            scripts/qa/product-contracts.mjs \
            docs/PRODUCTION-RELEASE-CHECKLIST.md \
            docs/marketplace-qa-checklist.md \
            docs/marketplace-product-experience.md
          git commit -m "chore(format): format marketplace tracking changes"
          git push origin HEAD:feat/marketplace-order-tracking-production
          test "$FORMAT_OUTCOME" = "success"

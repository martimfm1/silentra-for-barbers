name: Format marketplace final pass

on:
  push:
    branches:
      - marketplace-product-detail-and-boost

permissions:
  contents: write

jobs:
  format:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(style):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: marketplace-product-detail-and-boost
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format the five CI-reported files
        run: |
          pnpm exec prettier --write \
            app/api/marketplace/orders/route.ts \
            app/api/marketplace/orders/track/route.ts \
            docs/marketplace-product-experience.md \
            docs/marketplace-qa-checklist.md \
            scripts/qa/product-contracts.mjs
      - name: Commit formatting and remove this workflow
        run: |
          rm .github/workflows/format-marketplace-final-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/marketplace/orders/route.ts
          git add app/api/marketplace/orders/track/route.ts
          git add docs/marketplace-product-experience.md
          git add docs/marketplace-qa-checklist.md
          git add scripts/qa/product-contracts.mjs
          git add .github/workflows/format-marketplace-final-pass.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(style): format marketplace final CI files"
            git push origin marketplace-product-detail-and-boost
          fi

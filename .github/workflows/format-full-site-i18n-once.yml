name: one-time full-site i18n formatter

on:
  push:
    branches:
      - feat/full-site-internationalization

permissions:
  contents: write

jobs:
  format-and-remove-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout i18n branch
        uses: actions/checkout@v4
        with:
          ref: feat/full-site-internationalization
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format translated modules
        run: |
          pnpm exec prettier --write \
            app/locales/pt.ts \
            app/locales/en.ts \
            app/marketplace/page.tsx \
            "app/marketplace/[productId]/page.tsx" \
            app/marketplace/track/tracking-client.tsx \
            app/barbershops/page.tsx \
            app/barbershops/components/search-filter-bar.tsx \
            app/barbershops/components/mobile-search-filter-bar.tsx \
            app/barbershops/components/shop-card.tsx \
            app/confirm-email/page.tsx \
            app/forgot-password/page.tsx \
            app/reset-password/page.tsx \
            app/email-confirmed/page.tsx \
            app/email-confirmation-error/page.tsx \
            scripts/qa/i18n-contracts.mjs \
            package.json
      - name: Remove one-time workflow and commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-full-site-i18n-once.yml
          git add \
            app/locales/pt.ts \
            app/locales/en.ts \
            app/marketplace/page.tsx \
            "app/marketplace/[productId]/page.tsx" \
            app/marketplace/track/tracking-client.tsx \
            app/barbershops/page.tsx \
            app/barbershops/components/search-filter-bar.tsx \
            app/barbershops/components/mobile-search-filter-bar.tsx \
            app/barbershops/components/shop-card.tsx \
            app/confirm-email/page.tsx \
            app/forgot-password/page.tsx \
            app/reset-password/page.tsx \
            app/email-confirmed/page.tsx \
            app/email-confirmation-error/page.tsx \
            scripts/qa/i18n-contracts.mjs \
            package.json
          git commit -m "chore(format): format site internationalization changes"
          git push origin HEAD:feat/full-site-internationalization

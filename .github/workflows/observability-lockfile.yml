name: Regenerate observability lockfile

on:
  push:
    branches:
      - feat/posthog-sentry-observability
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/observability-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Update lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update lockfile for PostHog and Sentry"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
  QA_BASE_URL: http://127.0.0.1:3000

jobs:
  quality:
    name: Quality + Production Hardening
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: API audit
        run: pnpm qa:api

      - name: Client matching and tenant isolation contracts
        run: pnpm qa:client-matching

      - name: Minimum booking notice contracts
        run: pnpm qa:minimum-booking-notice

      - name: Dashboard personalization contracts
        run: pnpm qa:dashboard-preferences

      - name: Plan contracts
        run: pnpm qa:plans

      - name: Security audit
        run: pnpm qa:security

      - name: UI copy audit
        run: pnpm qa:copy

      - name: Internationalization contracts
        run: pnpm qa:i18n

      - name: Agenda dialog contracts
        run: pnpm qa:agenda-dialogs

      - name: Closed-day localization contracts
        run: pnpm qa:closed-days

      - name: Button accessible-name audit
        run: pnpm qa:buttons

      - name: Performance contracts
        run: pnpm qa:performance

      - name: Product contracts
        run: pnpm qa:product

      - name: Support chat contracts
        run: pnpm qa:support

      - name: UI/UX and accessibility contracts
        run: pnpm qa:ux

      - name: Horizontal overflow contracts
        run: pnpm qa:overflow

      - name: Manual payment contracts
        run: pnpm qa:manual-payments

      - name: Manual promotion contracts
        run: pnpm qa:manual-promotions

      - name: Enterprise landing-page and public API contracts
        run: pnpm qa:enterprise-landing-pages

      - name: Requested feature workflow contracts
        run: pnpm qa:feature-workflows

      - name: Dependency audit
        run: pnpm qa:deps


      - name: SEO foundation contracts
        run: pnpm qa:seo

      - name: PWA installability contracts
        run: pnpm qa:pwa

      - name: Cookie consent and legal-document contracts
        run: pnpm qa:cookies

      - name: Build
        run: pnpm build

      - name: Start production server
        run: pnpm start > /tmp/silentra-next.log 2>&1 &

      - name: Wait for production server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/silentra-next.log
          exit 1

      - name: Smoke QA
        run: pnpm qa:smoke

name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
  QA_BASE_URL: http://127.0.0.1:3000

jobs:
  quality:
    name: Quality + Production Hardening
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: API audit
        run: pnpm qa:api

      - name: Plan contracts
        run: pnpm qa:plans

      - name: Security audit
        run: pnpm qa:security

      - name: UI copy audit
        run: pnpm qa:copy

      - name: Product contracts
        run: pnpm qa:product

      - name: Manual payment contracts
        run: pnpm qa:manual-payments

      - name: Manual promotion contracts
        run: pnpm qa:manual-promotions

      - name: Dependency audit
        run: pnpm qa:deps

      - name: Format check diagnostics
        run: |
          pnpm exec prettier --write \\
            app/api/billing/manual-checkout/route.ts \\
            app/api/billing/manual-promotion/route.ts \\
            components/billing/manual-checkout.tsx \\
            scripts/qa/manual-promotions.mjs \\
            services/billing/email-templates.ts
          git diff --unified=2 -- \\
            app/api/billing/manual-checkout/route.ts \\
            app/api/billing/manual-promotion/route.ts \\
            components/billing/manual-checkout.tsx \\
            scripts/qa/manual-promotions.mjs \\
            services/billing/email-templates.ts

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Start production server
        run: pnpm start > /tmp/silentra-next.log 2>&1 &

      - name: Wait for production server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/silentra-next.log
          exit 1

      - name: Smoke QA
        run: pnpm qa:smoke

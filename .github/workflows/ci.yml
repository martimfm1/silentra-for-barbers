name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
  QA_BASE_URL: http://127.0.0.1:3000

jobs:
  quality:
    name: Quality + Production Hardening
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Persist refreshed lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh pnpm lockfile"
          git push

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: API audit
        run: pnpm qa:api

      - name: Plan contracts
        run: pnpm qa:plans

      - name: Security audit
        run: pnpm qa:security

      - name: Dependency audit
        run: pnpm qa:deps

      - name: UI copy audit
        run: pnpm qa:copy

      - name: Product contracts
        run: pnpm qa:product

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Start production server
        run: pnpm start > /tmp/silentra-next.log 2>&1 &

      - name: Wait for production server
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/silentra-next.log
          exit 1

      - name: Smoke QA
        run: pnpm qa:smoke

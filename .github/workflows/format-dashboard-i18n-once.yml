name: one-time dashboard i18n formatter

on:
  push:
    branches:
      - feat/full-site-internationalization

permissions:
  contents: write

jobs:
  format-and-remove-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout i18n branch
        uses: actions/checkout@v4
        with:
          ref: feat/full-site-internationalization
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format all i18n changes
        run: |
          pnpm exec prettier --write \
            app/locales/pt.ts \
            app/locales/en.ts \
            app/dashboard/page.tsx \
            app/dashboard/agenda/page.tsx \
            app/dashboard/pos/pedidos/page.tsx \
            app/onboarding/page.tsx \
            scripts/qa/i18n-contracts.mjs
      - name: Remove workflow and commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-dashboard-i18n-once.yml
          git add app/locales/pt.ts app/locales/en.ts app/dashboard/page.tsx app/dashboard/agenda/page.tsx app/dashboard/pos/pedidos/page.tsx app/onboarding/page.tsx scripts/qa/i18n-contracts.mjs
          git commit -m "chore(format): format dashboard i18n changes"
          git push origin HEAD:feat/full-site-internationalization

name: Temporary PR formatter

on:
  push:
    branches: [security/marketplace-catalog-hardening]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and commit
        run: |
          pnpm exec prettier --write app/api/silentra-admin/overview/route.ts app/api/stripe/subscription/route.ts scripts/qa/env-check.mjs app/api/marketplace/products/route.ts scripts/qa/api-audit.mjs scripts/qa/security-audit.mjs
          if git diff --quiet; then
            echo 'No formatting changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/silentra-admin/overview/route.ts app/api/stripe/subscription/route.ts scripts/qa/env-check.mjs app/api/marketplace/products/route.ts scripts/qa/api-audit.mjs scripts/qa/security-audit.mjs
          git commit -m 'style(security): apply Prettier formatting'
          git push origin HEAD:${{ github.ref_name }}

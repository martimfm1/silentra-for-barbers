name: one-time onboarding switcher formatter

on:
  push:
    branches:
      - feat/full-site-internationalization

permissions:
  contents: write

jobs:
  format-and-remove-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout i18n branch
        uses: actions/checkout@v4
        with:
          ref: feat/full-site-internationalization
          persist-credentials: true
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format onboarding page
        run: pnpm exec prettier --write app/onboarding/page.tsx
      - name: Remove workflow and commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-onboarding-i18n-once.yml
          git add app/onboarding/page.tsx
          git commit -m "chore(format): format onboarding language switcher"
          git push origin HEAD:feat/full-site-internationalization

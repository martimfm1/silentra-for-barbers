name: Temporary Prettier format fix

on:
  push:
    branches:
      - fix/format-recovery-email-validator

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format recovery route
        run: pnpm exec prettier --write app/api/auth/forgot-password/route.ts

      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/_temporary-prettier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/auth/forgot-password/route.ts .github/workflows/_temporary-prettier.yml
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: format recovery email validator"
          git push origin HEAD:fix/format-recovery-email-validator

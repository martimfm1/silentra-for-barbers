<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Banner predefinido de barbearia</title>
  <desc id="desc">Fundo escuro e elegante com luzes suaves e formas inspiradas num salão de barbearia.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202a26"/>
      <stop offset=".52" stop-color="#111715"/>
      <stop offset="1" stop-color="#090c0b"/>
    </linearGradient>
    <radialGradient id="light" cx="72%" cy="22%" r="70%">
      <stop offset="0" stop-color="#6aa987" stop-opacity=".25"/>
      <stop offset=".48" stop-color="#4f8068" stop-opacity=".08"/>
      <stop offset="1" stop-color="#111715" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dce9df" stop-opacity=".04"/>
      <stop offset=".5" stop-color="#dce9df" stop-opacity=".18"/>
      <stop offset="1" stop-color="#dce9df" stop-opacity=".04"/>
    </linearGradient>
    <pattern id="lines" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M83 0V84" stroke="#d5eadc" stroke-opacity=".045" stroke-width="1"/>
      <path d="M0 83H84" stroke="#d5eadc" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="600" fill="url(#back)"/>
  <rect width="1600" height="600" fill="url(#light)"/>
  <rect width="1600" height="600" fill="url(#lines)"/>
  <g opacity=".34">
    <rect x="130" y="-65" width="110" height="740" rx="55" fill="url(#pole)" transform="rotate(18 185 300)"/>
    <rect x="170" y="-30" width="8" height="670" rx="4" fill="#9ccbb0" fill-opacity=".16" transform="rotate(18 174 300)"/>
    <rect x="245" y="-30" width="8" height="670" rx="4" fill="#9ccbb0" fill-opacity=".11" transform="rotate(18 249 300)"/>
  </g>
  <g fill="none" stroke="#b7ddc7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1300" cy="238" r="48" stroke-width="10" stroke-opacity=".23"/>
    <circle cx="1422" cy="238" r="48" stroke-width="10" stroke-opacity=".23"/>
    <path d="M1330 209 1450 88M1392 209 1272 88" stroke-width="11" stroke-opacity=".2"/>
    <circle cx="1361" cy="179" r="9" fill="#b7ddc7" fill-opacity=".17" stroke="none"/>
  </g>
  <path d="M0 496C260 455 440 548 715 505S1200 462 1600 510V600H0Z" fill="#050807" fill-opacity=".24"/>
  <path d="M64 64H350M64 64V118M1536 536H1260M1536 536V482" fill="none" stroke="#9bd0b2" stroke-opacity=".23" stroke-width="2"/>
  <circle cx="1478" cy="120" r="3" fill="#b9dfc9" fill-opacity=".65"/>
  <circle cx="1500" cy="120" r="3" fill="#b9dfc9" fill-opacity=".35"/>
  <circle cx="1522" cy="120" r="3" fill="#b9dfc9" fill-opacity=".18"/>
</svg>
